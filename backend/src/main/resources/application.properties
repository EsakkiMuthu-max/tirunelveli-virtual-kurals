server.port=8080

spring.application.name=Tirunelveli Virtual Kural

# MySQL 8: the database is created automatically on first run (createDatabaseIfNotExist=true).
# Override with env vars DB_URL / DB_USERNAME / DB_PASSWORD if your setup differs.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tirunelveli_virtual_kural?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:tvk_user}
spring.datasource.password=${DB_PASSWORD:TvkProject@2026!}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Evidence files are stored inside the database, so the multipart limit must allow them through.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB

# The Vite dev server origin allowed to send session cookies.
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
app.seed.citizen-count=9999
app.seed.citizen-password=citizen@123
app.seed.officer-password=officer@123

logging.level.com.tirunelveli=INFO

# The React frontend speaks snake_case JSON (citizen_id, display_name, ...). Map Java camelCase
# fields to snake_case on both request and response, otherwise login bodies arrive as null.
spring.jackson.property-naming-strategy=SNAKE_CASE
